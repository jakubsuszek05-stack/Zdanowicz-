<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:Calibri,Carlito,"DejaVu Sans",sans-serif;}
svg text{font-family:Calibri,Carlito,"DejaVu Sans",sans-serif;}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <style>
    .b{fill:#eef3fb;stroke:#2f4f7f;stroke-width:2}
    .q{fill:#fff6e0;stroke:#a66b00;stroke-width:2}
    .x{fill:#f3f3f3;stroke:#777;stroke-width:1.5;stroke-dasharray:6 4}
    .k{fill:#e6f4ea;stroke:#2e7d32;stroke-width:2}
    .t{font-size:19px;fill:#111;text-anchor:middle}
    .s{font-size:15px;fill:#333;text-anchor:middle}
    .l{font-size:16px;fill:#111;font-weight:bold}
    .ln{stroke:#222;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>

  <rect class="b" x="250" y="10" width="400" height="62" rx="8"/>
  <text class="t" x="450" y="38" font-weight="bold">Przyjęcie pojazdu, wywiad i diagnoza</text>
  <text class="s" x="450" y="60">objawy zużycia – rozdział 4</text>
  <line class="ln" x1="450" y1="72" x2="450" y2="98"/>

  <rect class="b" x="250" y="100" width="400" height="62" rx="8"/>
  <text class="t" x="450" y="128" font-weight="bold">Przygotowanie stanowiska i pojazdu</text>
  <text class="s" x="450" y="150">czynności 1–4</text>
  <line class="ln" x1="450" y1="162" x2="450" y2="188"/>

  <rect class="b" x="250" y="190" width="400" height="62" rx="8"/>
  <text class="t" x="450" y="218" font-weight="bold">Demontaż koła, zacisku i klocków</text>
  <text class="s" x="450" y="240">czynności 5–10</text>
  <line class="ln" x1="450" y1="252" x2="450" y2="278"/>

  <rect class="b" x="250" y="280" width="400" height="62" rx="8"/>
  <text class="t" x="450" y="308" font-weight="bold">Weryfikacja części (pomiary)</text>
  <text class="s" x="450" y="330">czynności 11–15</text>
  <line class="ln" x1="450" y1="342" x2="450" y2="372"/>

  <polygon class="q" points="450,374 660,449 450,524 240,449"/>
  <text class="t" x="450" y="440">tarcza ≥ 23,0 mm</text>
  <text class="t" x="450" y="464">i bicie ≤ 0,05 mm?</text>
  <line class="ln" x1="660" y1="449" x2="708" y2="449"/>
  <text class="l" x="668" y="438">NIE</text>
  <rect class="x" x="710" y="404" width="180" height="90" rx="8"/>
  <text class="s" x="800" y="436">wymiana lub</text>
  <text class="s" x="800" y="456">przetoczenie tarczy</text>
  <text class="s" x="800" y="476">(poza zakresem karty)</text>
  <line class="ln" x1="450" y1="524" x2="450" y2="556"/>
  <text class="l" x="460" y="546">TAK</text>

  <rect class="b" x="250" y="558" width="400" height="62" rx="8"/>
  <text class="t" x="450" y="586" font-weight="bold">Czyszczenie, smarowanie, przygotowanie</text>
  <text class="s" x="450" y="608">czynności 16–21</text>
  <line class="ln" x1="450" y1="620" x2="450" y2="646"/>

  <rect class="b" x="250" y="648" width="400" height="62" rx="8"/>
  <text class="t" x="450" y="676" font-weight="bold">Montaż klocków, zacisku i koła</text>
  <text class="s" x="450" y="698">czynności 22–28 (34,3 N·m; 103 N·m)</text>
  <line class="ln" x1="450" y1="710" x2="450" y2="736"/>

  <rect class="b" x="250" y="738" width="400" height="62" rx="8"/>
  <text class="t" x="450" y="766" font-weight="bold">Czynności końcowe</text>
  <text class="s" x="450" y="788">czynności 29–32</text>
  <line class="ln" x1="450" y1="800" x2="450" y2="826"/>

  <rect class="k" x="250" y="828" width="400" height="62" rx="8"/>
  <text class="t" x="450" y="856" font-weight="bold">Kontrola jakości po naprawie</text>
  <text class="s" x="450" y="878">rozdział 7 – pedał, płyn, stanowisko rolkowe</text>
  <line class="ln" x1="450" y1="890" x2="450" y2="920"/>

  <polygon class="q" points="450,922 670,1000 450,1078 230,1000"/>
  <text class="t" x="450" y="990">skuteczność ≥ 50%</text>
  <text class="t" x="450" y="1014">i różnica sił ≤ 30%?</text>
  <path class="ln" d="M230,1000 H80 V311 H246"/>
  <text class="l" x="150" y="990">NIE</text>
  <line class="ln" x1="450" y1="1078" x2="450" y2="1106"/>
  <text class="l" x="460" y="1098">TAK</text>

  <rect class="k" x="300" y="1108" width="300" height="56" rx="8"/>
  <text class="t" x="450" y="1142" font-weight="bold">Wydanie pojazdu klientowi</text>
</svg>
</body></html>
